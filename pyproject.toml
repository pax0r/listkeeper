[project]
name = "listkeeper"
version = "0.1.0"
requires-python = ">=3.14.2,<3.15"
dependencies = ["SQLAlchemy>=2.0.43,<2.1", "alembic>=1.16,<2", "PyMySQL>=1.1,<2", "psycopg2-binary>=2.9,<3"]

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=1", "ruff>=0.12", "tzdata>=2025.2"]
ha = ["pytest-homeassistant-custom-component==0.13.375", "home-assistant-frontend==20260930.5"]
container = ["aiohttp>=3.13,<4"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
pythonpath = ["."]
markers = ["container: requires the isolated Home Assistant Docker Compose environment"]

[tool.ruff]
target-version = "py314"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]
